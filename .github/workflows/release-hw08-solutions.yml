name: Release Homework 8 solutions

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-hw08-solutions.yml
      - .github/scripts/release_hw08_solutions.py
      - _incoming/hw08-solutions-2026.tar.gz.enc
  schedule:
    # Start the runner early, then wait until 05:01 UTC (12:01 a.m. Eastern) on November 16.
    - cron: '46 4 16 11 *'
    - cron: '1,21,41 5 16 11 *'
    - cron: '16 6,8,12 16 11 *'
  workflow_dispatch:
    inputs:
      validate_only:
        description: Validate the encrypted package without publishing
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: release-hw08-solutions-2026
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      VALIDATE_ONLY: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.validate_only)) && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Wait for the release time
        id: window
        if: env.VALIDATE_ONLY == 'false'
        run: python3 .github/scripts/release_hw08_solutions.py window
      - name: Refresh the default branch at release time
        if: steps.window.outputs.due == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin "$DEFAULT_BRANCH"
          git reset --hard FETCH_HEAD
      - name: Validate or prepare the HW 8 release
        id: release
        if: env.VALIDATE_ONLY == 'true' || steps.window.outputs.due == 'true'
        env:
          HW08_RELEASE_PASSWORD: ${{ secrets.HW08_RELEASE_PASSWORD }}
        run: python3 .github/scripts/release_hw08_solutions.py prepare
      - name: Commit and push the solutions
        if: steps.release.outputs.changed == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add resources/homeworks/hw08 _modules/week-11.md .github/releases/hw08-solutions-2026.complete
          git commit -m 'Release Homework 8 solutions'
          git push origin "HEAD:$DEFAULT_BRANCH"
      - name: Check whether the solutions are already live
        id: site
        if: steps.window.outputs.due == 'true'
        run: python3 .github/scripts/release_hw08_solutions.py live
      # The GitHub Actions token's push does not trigger the regular site build.
      - name: Deploy the solutions
        if: steps.window.outputs.due == 'true' && steps.site.outputs.live == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run build-site.yml --ref "$DEFAULT_BRANCH"
      - name: Verify the live homepage, assignment, and solutions PDF
        if: steps.window.outputs.due == 'true' && steps.site.outputs.live == 'false'
        run: python3 -u .github/scripts/release_hw08_solutions.py verify
      - name: Disable the completed one-time workflow
        if: steps.window.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable release-hw08-solutions.yml
