name: Update lecture recording link

on:
  workflow_dispatch: {}
  schedule:
    # GitHub cron is UTC.
    # 2:05 PM America/Detroit = 19:05 UTC during standard time (EST, winter).
    # NOTE: During daylight time (EDT, summer), 2:05 PM is 18:05 UTC, so this will run at 3:05 PM local.
    - cron: "5 19 * * 1,3"  # Mon (1) and Wed (3) at 19:05 UTC

permissions:
  contents: write

jobs:
  update-recording:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update recording link
        run: python .github/scripts/update_recording_link.py

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _modules
          git commit -m "Add lecture recording link"
          git push
