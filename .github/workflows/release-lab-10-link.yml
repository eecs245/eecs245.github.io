name: Release Lab 10 homepage link

on:
  schedule:
    # November 11, 2026, 5:30 PM EST = 22:30 UTC.
    - cron: "30 22 11 11 *"
    # Retry if the first run is dropped or fails; the script enforces the year.
    - cron: "15 23 11 11 *"
    - cron: "15 2 12 11 *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: release-lab-10-link
  cancel-in-progress: false

jobs:
  release-link:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Link Lab 10 when due
        id: release
        run: python3 .github/scripts/release_lab_10_link.py

      - name: Commit and push
        if: steps.release.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _modules/week-11.md
          git commit -m "Link Lab 10 on the homepage"
          git push

      - name: Deploy the updated homepage
        if: steps.release.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # GITHUB_TOKEN pushes do not trigger the normal push workflow.
          # Retry deployment even if a preceding attempt already committed.
          gh workflow run build-site.yml --ref "$DEFAULT_BRANCH"
