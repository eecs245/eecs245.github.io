name: build-site

on:
  # Normal pushes (your usual edits)
  push:
    branches: [master, main]
    # Avoid burning a Pages run on the raw PDF upload commit from the shortcut.
    # The "attach" workflow will finish and trigger the real build via workflow_run.
    paths-ignore:
      - "resources/lecture-pdfs/**"
      - "_incoming/**"

  # Critical: run when the attach workflow completes, even if the triggering commit had [skip ci]
  workflow_run:
    workflows: ["Attach live notes for lecture"]  # MUST match the attach workflow's `name:` exactly
    types: [completed]

jobs:
  build-and-deploy:
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    runs-on: ubuntu-latest

    concurrency:
      group: "pages"
      cancel-in-progress: true

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      # For workflow_run: we want the *current* default branch HEAD (after the attach workflow pushed),
      # not the workflow_run head_sha.
      - name: Checkout default branch
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # If you actually use jupyter-book caching, keep this; otherwise delete it.
      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: _build/.jupyter_cache
          key: site-cache-${{ hashFiles('requirements.txt') }}

      # Replace this build command with whatever your gh-pages site uses.
      # If you're still using jupyter-book, keep it. If not, change it.
      - name: Build site
        run: |
          jupyter-book build .

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _build/html

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
