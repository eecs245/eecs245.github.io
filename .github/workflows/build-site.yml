name: build-site

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "resources/lecture-pdfs/**"
      - "_incoming/**"

  workflow_run:
    workflows: ["Attach live lecture notes"]
    types: [completed]

  workflow_dispatch: {}

concurrency:
  group: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' && github.run_id || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    runs-on: ubuntu-latest

    outputs:
      artifact_name: github-pages-${{ github.run_attempt }}

    permissions:
      contents: read
      pages: write

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Set up course search runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/course-search/package-lock.json

      - name: Install PDF text and OCR tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr

      - name: Install course search dependencies
        working-directory: tools/course-search
        run: npm ci --onnxruntime-node-install-cuda=skip

      - name: Install caption importer dependencies
        run: python3 -m pip install -r tools/course-search/scripts/requirements.txt

      - name: Rebuild public course search index
        run: bash tools/course-search/scripts/rebuild_for_jekyll.sh

      - name: Build site with Jekyll
        run: bundle exec jekyll build --source . --destination ./_site
        env:
          JEKYLL_ENV: production

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site
          name: github-pages-${{ github.run_attempt }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: publish
        continue-on-error: true
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}

      # deploy-pages looks up the upload by name, which can briefly return no matches.
      - name: Wait before retrying deployment creation
        if: steps.publish.outcome == 'failure' && !steps.publish.outputs.page_url
        run: sleep 30

      - name: Retry deployment creation
        if: steps.publish.outcome == 'failure' && !steps.publish.outputs.page_url
        uses: actions/deploy-pages@v5
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}

      - name: Report failure after deployment started
        if: steps.publish.outcome == 'failure' && steps.publish.outputs.page_url
        run: exit 1
