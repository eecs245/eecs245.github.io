name: build-site

on:
  push:
    branches: [master, main]
    # Optional but recommended: don't waste a Pages build on the raw PDF upload commit
    # (your attach workflow will trigger the real build)
    paths-ignore:
      - "resources/lecture-pdfs/**"
      - "_incoming/**"

  # Key fix: run Pages build when the attach workflow completes
  workflow_run:
    workflows: ["Attach live lecture notes"]
    types: [completed]

jobs:
  deploy-book:
    # Only run for successful attach runs (but always run for push)
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    runs-on: ubuntu-latest

    concurrency:
      group: "pages"
      cancel-in-progress: true

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      # IMPORTANT: For workflow_run, do NOT checkout head_sha (that's the commit that triggered attach).
      # We want the updated default branch HEAD after attach has pushed its changes.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: cache executed notebooks
        uses: actions/cache@v4
        with:
          path: _build/.jupyter_cache
          key: jupyter-book-cache-${{ hashFiles('requirements.txt', '_config.yml', '_toc.yml') }}

      - name: Build the book
        run: jupyter-book build .

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _build/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
