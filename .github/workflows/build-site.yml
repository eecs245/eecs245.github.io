name: build-site

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "resources/lecture-pdfs/**"
      - "_incoming/**"

  workflow_run:
    workflows: ["Attach live lecture notes"]
    types: [completed]

  workflow_dispatch: {}

jobs:
  build-and-deploy:
    if: |
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    runs-on: ubuntu-latest

    concurrency:
      group: "pages"
      cancel-in-progress: true

    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Set up course search runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/course-search/package-lock.json

      - name: Install PDF text and OCR tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr

      - name: Install course search dependencies
        working-directory: tools/course-search
        run: npm ci

      - name: Rebuild public course search index
        run: bash tools/course-search/scripts/rebuild_for_jekyll.sh

      - name: Build site with Jekyll
        run: bundle exec jekyll build --source . --destination ./_site
        env:
          JEKYLL_ENV: production

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
