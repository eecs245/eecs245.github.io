name: Release Lab 6 homepage link

on:
  schedule:
    # 5:30 PM EDT on October 14 (21:30 UTC).
    - cron: "30 21 14 10 *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release-link:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Confirm the one-time release date
        id: release-date
        run: |
          if [[ "${{ github.event_name }}" == "schedule" && "$(date -u +%F)" != "2026-10-14" ]]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: this one-time release was scheduled for October 14, 2026."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Release Lab 6 link
        if: steps.release-date.outputs.release == 'true'
        run: python3 .github/scripts/release_lab_6_link.py

      - name: Commit and push
        if: steps.release-date.outputs.release == 'true'
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _modules/week-07.md
          git commit -m "Release Lab 6 homepage link"
          git push
